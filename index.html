<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACT Math: Trigonometry</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:14px 18px;z-index:5}h1{margin:0 0 8px;font-size:1.35rem}.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:.95rem}.bar{height:8px;background:#e6e6e6;border-radius:99px;overflow:hidden;margin-top:10px}#progress{height:100%;width:0;background:#555}main{max-width:850px;margin:20px auto 90px;padding:0 14px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:16px}.qnum{font-weight:bold;margin-bottom:8px}.option{display:block;border:1px solid #ccc;border-radius:9px;padding:10px 12px;margin:8px 0;cursor:pointer}.option:hover{background:#f0f0f0}.option input{margin-right:10px}.controls{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:12px;text-align:center}button{padding:10px 18px;margin:4px;border-radius:8px;border:1px solid #aaa;background:#fff;cursor:pointer;font-size:1rem}button.primary{background:#222;color:#fff;border-color:#222}.correct{border-left:5px solid #2e7d32}.incorrect{border-left:5px solid #c62828}.exp{margin-top:10px;padding:10px;background:#f8f8f8;border-radius:8px;display:none}#results{background:#fff;border:1px solid #bbb;border-radius:12px;padding:18px;margin-bottom:18px;display:none}.score{font-size:1.4rem;font-weight:bold}.small{color:#555;font-size:.9rem}</style></head><body><header><h1>ACT Math: Trigonometry</h1><div class="meta"><span id="answered">Answered: 0 / 20</span><span id="timer">Time: 00:00</span></div><div class="bar"><div id="progress"></div></div></header><main><div id="results"></div><div id="quiz"></div></main><div class="controls"><button class="primary" onclick="gradeQuiz()">Grade Quiz</button><button onclick="resetQuiz()">Reset</button></div><script>const questions=[{"q": "sin θ equals:", "options": ["adjacent/hypotenuse", "opposite/hypotenuse", "opposite/adjacent", "hypotenuse/opposite"], "answer": 1, "explanation": "SOH."}, {"q": "cos θ equals:", "options": ["adjacent/hypotenuse", "opposite/hypotenuse", "opposite/adjacent", "hypotenuse/adjacent"], "answer": 0, "explanation": "CAH."}, {"q": "tan θ equals:", "options": ["adjacent/opposite", "opposite/hypotenuse", "opposite/adjacent", "hypotenuse/adjacent"], "answer": 2, "explanation": "TOA."}, {"q": "Opposite=3, hypotenuse=5. sin θ?", "options": ["3/4", "3/5", "4/5", "5/3"], "answer": 1, "explanation": "3/5."}, {"q": "Adjacent=12, hypotenuse=13. cos θ?", "options": ["5/13", "12/13", "13/12", "12/5"], "answer": 1, "explanation": "12/13."}, {"q": "Opposite=8, adjacent=15. tan θ?", "options": ["8/15", "15/8", "8/17", "15/17"], "answer": 0, "explanation": "8/15."}, {"q": "sin 30°?", "options": ["0", "1/2", "√2/2", "√3/2"], "answer": 1, "explanation": "Standard value."}, {"q": "cos 60°?", "options": ["0", "1/2", "√2/2", "√3/2"], "answer": 1, "explanation": "Standard value."}, {"q": "tan 45°?", "options": ["0", "1", "√2", "√3"], "answer": 1, "explanation": "Standard value."}, {"q": "If sin θ=5/13 and opposite=5, hypotenuse?", "options": ["8", "10", "12", "13"], "answer": 3, "explanation": "sin=opp/hyp."}, {"q": "5-12-13 triangle, angle opposite 5. cos θ?", "options": ["5/13", "12/13", "5/12", "12/5"], "answer": 1, "explanation": "Adjacent/hypotenuse=12/13."}, {"q": "10-ft ladder at 60° to ground. Height?", "options": ["5", "5√2", "5√3", "10√3"], "answer": 2, "explanation": "10sin60°=5√3."}, {"q": "If tan θ=1 and θ acute, θ?", "options": ["30°", "45°", "60°", "90°"], "answer": 1, "explanation": "tan45°=1."}, {"q": "Which identity is always true?", "options": ["sinθ+cosθ=1", "sin²θ+cos²θ=1", "tanθ=sinθ·cosθ", "sinθ=1/cosθ"], "answer": 1, "explanation": "Pythagorean identity."}, {"q": "If sin θ=0.6 and θ acute, cos θ?", "options": ["0.4", "0.6", "0.8", "1.0"], "answer": 2, "explanation": "3-4-5 ratio gives 0.8."}, {"q": "If cos θ=√3/2 and θ acute, θ?", "options": ["30°", "45°", "60°", "90°"], "answer": 0, "explanation": "cos30°=√3/2."}, {"q": "Angle 35°, adjacent 10, opposite x. Which equation finds x?", "options": ["x=10sin35°", "x=10cos35°", "x=10tan35°", "x=10/tan35°"], "answer": 2, "explanation": "tan35°=x/10."}, {"q": "Hypotenuse 20, angle 25°. Adjacent side?", "options": ["20sin25°", "20cos25°", "20tan25°", "20/cos25°"], "answer": 1, "explanation": "cos=adj/hyp."}, {"q": "180° in radians?", "options": ["π/2", "π", "2π", "360π"], "answer": 1, "explanation": "180°=π."}, {"q": "90° in radians?", "options": ["π/4", "π/2", "π", "2π"], "answer": 1, "explanation": "90°=π/2."}];let seconds=0;const letters=['A','B','C','D'];function t(s){const m=Math.floor(s/60).toString().padStart(2,'0'),x=(s%60).toString().padStart(2,'0');return `${m}:${x}`}setInterval(()=>{seconds++;document.getElementById('timer').textContent='Time: '+t(seconds)},1000);function render(){const qd=document.getElementById('quiz');qd.innerHTML='';questions.forEach((q,i)=>{const c=document.createElement('div');c.className='card';c.id='card-'+i;c.innerHTML=`<div class="qnum">${i+1} of ${questions.length}</div><div><strong>${q.q}</strong></div>`+q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" onchange="updateProgress()"><strong>${letters[j]}.</strong> ${o}</label>`).join('')+`<div class="exp" id="exp-${i}"></div>`;qd.appendChild(c)});updateProgress()}function updateProgress(){let a=0;questions.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))a++});document.getElementById('answered').textContent=`Answered: ${a} / ${questions.length}`;document.getElementById('progress').style.width=(a/questions.length*100)+'%'}function gradeQuiz(){let c=0,a=0;questions.forEach((q,i)=>{const card=document.getElementById('card-'+i),p=document.querySelector(`input[name=q${i}]:checked`),e=document.getElementById('exp-'+i);card.classList.remove('correct','incorrect');if(p){a++;if(Number(p.value)===q.answer){c++;card.classList.add('correct')}else card.classList.add('incorrect')}else card.classList.add('incorrect');e.style.display='block';e.innerHTML=`<strong>Correct answer: ${letters[q.answer]}. ${q.options[q.answer]}</strong><br>${q.explanation}`});const pct=Math.round(c/questions.length*100),r=document.getElementById('results');r.style.display='block';r.innerHTML=`<div class="score">${c} / ${questions.length} = ${pct}%</div><div class="small">Answered ${a} of ${questions.length}. Review the explanations below, especially every missed question.</div>`;scrollTo({top:0,behavior:'smooth'})}function resetQuiz(){document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);document.querySelectorAll('.card').forEach(c=>c.classList.remove('correct','incorrect'));document.querySelectorAll('.exp').forEach(e=>e.style.display='none');document.getElementById('results').style.display='none';seconds=0;updateProgress();scrollTo({top:0,behavior:'smooth'})}render();</script></body></html>
